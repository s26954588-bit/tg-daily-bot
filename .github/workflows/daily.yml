name: TG Daily Bot

on:
  # GitHub 自带 schedule 目前不可靠（新建库跑了快 24 小时一次没自己触发过），
  # 保留它当免费的"万一好了"备用，主力计划是之后配外部服务调 workflow_dispatch。
  schedule:
    - cron: '5 0,8 * * *'  # UTC 00:05 / 08:05 = 北京时间 08:05 / 16:05
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node index.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # 每周推一次空心跳 commit。GitHub 会在仓库满 60 天无活动时自动禁用定时
      # workflow（2026-09-01 就是这样断的），有活动记录就不会再被禁用。
      - name: Keepalive
        if: always()
        run: |
          STAMP=$(date -u +%Y-W%V)
          [ "$(cat .keepalive 2>/dev/null)" = "$STAMP" ] && exit 0
          echo "$STAMP" > .keepalive
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .keepalive
          git commit -m "chore: keepalive $STAMP"
          git push
